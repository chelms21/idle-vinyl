<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl Empire Idle</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vinyl: { 900: '#121212', 800: '#1e1e1e', 700: '#2a2a2a', accent: '#f59e0b' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-vinyl-900 text-gray-100 font-sans min-h-screen flex flex-col">

  <!-- Top Header Navigation / Dashboard -->
  <header class="bg-vinyl-800 border-b border-gray-800 p-4 sticky top-0 z-20 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-amber-500">💿 Vinyl Empire</h1>
        <p id="stage-title" class="text-xs text-gray-400">Garage DIY Press</p>
      </div>
      <div class="text-right">
        <div class="text-xs text-gray-400 uppercase tracking-wider">Cash Balance</div>
        <div id="cash-display" class="text-2xl font-black text-green-400">$0</div>
      </div>
    </div>
  </header>

  <!-- Main Game Workspace -->
  <main class="max-w-4xl w-full mx-auto p-4 flex-grow space-y-4">
    
    <!-- Action Bar & Save Management -->
    <div class="bg-vinyl-800 p-3 rounded-lg border border-gray-800 flex flex-wrap justify-between items-center gap-2">
      <div class="flex gap-2">
        <button onclick="exportSave()" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-xs font-semibold rounded transition cursor-pointer">
          💾 Export Save
        </button>
        <button onclick="document.getElementById('import-input').click()" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-xs font-semibold rounded transition cursor-pointer">
          📂 Import Save
        </button>
        <input type="file" id="import-input" accept=".json" class="hidden" onchange="importSave(event)" />
      </div>
      <button onclick="resetGame()" class="px-3 py-1.5 bg-red-900/40 hover:bg-red-800/60 text-red-300 text-xs font-semibold rounded transition cursor-pointer">
        ⚠️ Reset
      </button>
    </div>

    <!-- Staff / Worker Management Card -->
    <div class="bg-vinyl-800 p-4 rounded-lg border border-gray-800 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
      <div class="space-y-1">
        <div class="flex items-center gap-2">
          <h3 class="font-bold text-gray-100">👷 Plant Staff</h3>
          <span id="techs-count" class="px-2 py-0.5 bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs rounded font-mono">0 Hired</span>
        </div>
        <p class="text-xs text-gray-400">Each technician grants a <span class="text-blue-400 font-mono">+15% speed boost</span> to all stations.</p>
      </div>
      <button id="hire-tech-btn" onclick="hireTechnician()" 
        class="px-4 py-2 text-xs font-bold rounded transition bg-blue-600 hover:bg-blue-500 text-white cursor-pointer">
        Hire Tech ($250)
      </button>
    </div>

    <!-- Stations List -->
    <div id="stations-container" class="space-y-3">
      <!-- Built once on load -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-500 py-4 border-t border-gray-800">
    Vinyl Empire Idle • Static Web Application
  </footer>

  <!-- Core Game Logic -->
  <script>
    const defaultState = {
      cash: 10,
      stage: 'Garage DIY Press',
      techsHired: 0,
      techBaseCost: 250,
      lastSaved: Date.now(),
      stations: [
        { id: 'lathe', name: '1. Mastering Lathe', level: 1, baseCost: 15, baseRevenue: 2, cycleTime: 1200, unlockCost: 0, unlocked: true, progress: 0 },
        { id: 'plating', name: '2. Matrix Plating', level: 0, baseCost: 120, baseRevenue: 12, cycleTime: 2500, unlockCost: 120, unlocked: false, progress: 0 },
        { id: 'granulator', name: '3. Vinyl Granulator', level: 0, baseCost: 1000, baseRevenue: 85, cycleTime: 4000, unlockCost: 1000, unlocked: false, progress: 0 },
        { id: 'press', name: '4. Hydraulic Press', level: 0, baseCost: 8500, baseRevenue: 600, cycleTime: 6500, unlockCost: 8500, unlocked: false, progress: 0 },
        { id: 'trimmer', name: '5. Edge Trimmer', level: 0, baseCost: 65000, baseRevenue: 4200, cycleTime: 9000, unlockCost: 65000, unlocked: false, progress: 0 },
        { id: 'sleeve', name: '6. Foil Sleeve Press', level: 0, baseCost: 500000, baseRevenue: 30000, cycleTime: 13000, unlockCost: 500000, unlocked: false, progress: 0 }
      ]
    };

    let gameState = JSON.parse(JSON.stringify(defaultState));
    const SAVE_KEY = 'VINYL_EMPIRE_SAVE_V4';

    // Balanced station upgrade cost curve (1.20x exponential growth)
    function getUpgradeCost(station) {
      return Math.floor(station.baseCost * Math.pow(1.20, station.level - 1));
    }

    // Balanced station revenue scaling (linear base payout per level)
    function getStationRevenue(station) {
      return Math.floor(station.baseRevenue * station.level);
    }

    // Exponential cost curve for staff (1.80x per hire)
    function getTechCost() {
      return Math.floor(gameState.techBaseCost * Math.pow(1.80, gameState.techsHired));
    }

    // Moderate speed scaling per level and per technician
    function getStationSpeedMultiplier(station) {
      const levelBonus = Math.pow(1.03, station.level - 1); // +3% speed per level
      const techBonus = 1 + (gameState.techsHired * 0.15);  // +15% speed per tech
      return levelBonus * techBonus;
    }

    // Build DOM elements ONCE
    function initUI() {
      const container = document.getElementById('stations-container');
      container.innerHTML = '';

      gameState.stations.forEach(station => {
        const card = document.createElement('div');
        card.id = `station-card-${station.id}`;

        if (!station.unlocked) {
          card.className = "p-4 rounded-lg border bg-vinyl-900 border-gray-800/50 opacity-60 transition";
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-bold text-gray-400">${station.name}</h3>
                <p class="text-xs text-gray-500">Locked Station</p>
              </div>
              <button id="action-btn-${station.id}" onclick="handleStationAction('${station.id}')" 
                class="px-4 py-2 text-xs font-bold rounded transition bg-gray-800 text-gray-500 cursor-not-allowed">
                Unlock ($${station.unlockCost.toLocaleString()})
              </button>
            </div>
          `;
        } else {
          card.className = "p-4 rounded-lg border bg-vinyl-800 border-gray-800 transition space-y-3";
          card.innerHTML = `
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <h3 class="font-bold text-gray-100">${station.name}</h3>
                  <span id="level-${station.id}" class="px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs rounded font-mono">Lvl ${station.level}</span>
                </div>
                <p class="text-xs text-gray-400">Yield: <span id="revenue-${station.id}" class="text-green-400 font-mono">+$${getStationRevenue(station).toLocaleString()}</span></p>
              </div>
              <button id="action-btn-${station.id}" onclick="handleStationAction('${station.id}')" 
                class="px-4 py-2 text-xs font-bold rounded transition bg-amber-500 hover:bg-amber-400 text-black cursor-pointer">
                Upgrade
              </button>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-vinyl-900 h-2.5 rounded-full overflow-hidden border border-gray-800">
              <div id="bar-${station.id}" class="bg-amber-500 h-full transition-all duration-75" style="width: 0%"></div>
            </div>
          `;
        }
        container.appendChild(card);
      });
      updateUI();
    }

    // Update UI elements in place
    function updateUI() {
      document.getElementById('cash-display').innerText = '$' + Math.floor(gameState.cash).toLocaleString();
      document.getElementById('stage-title').innerText = gameState.stage;

      // Staff UI
      document.getElementById('techs-count').innerText = `${gameState.techsHired} Hired`;
      const techBtn = document.getElementById('hire-tech-btn');
      const techCost = getTechCost();
      techBtn.innerText = `Hire Tech ($${techCost.toLocaleString()})`;
      if (gameState.cash >= techCost) {
        techBtn.className = "px-4 py-2 text-xs font-bold rounded transition bg-blue-600 hover:bg-blue-500 text-white cursor-pointer";
      } else {
        techBtn.className = "px-4 py-2 text-xs font-bold rounded transition bg-gray-800 text-gray-500 cursor-not-allowed";
      }

      // Stations UI
      gameState.stations.forEach(station => {
        const btn = document.getElementById(`action-btn-${station.id}`);
        if (!btn) return;

        if (!station.unlocked) {
          const canUnlock = gameState.cash >= station.unlockCost;
          btn.className = canUnlock 
            ? "px-4 py-2 text-xs font-bold rounded transition bg-amber-500 hover:bg-amber-400 text-black cursor-pointer" 
            : "px-4 py-2 text-xs font-bold rounded transition bg-gray-800 text-gray-500 cursor-not-allowed";
        } else {
          const lvlEl = document.getElementById(`level-${station.id}`);
          const revEl = document.getElementById(`revenue-${station.id}`);
          if (lvlEl) lvlEl.innerText = `Lvl ${station.level}`;
          if (revEl) revEl.innerText = `+$${getStationRevenue(station).toLocaleString()}`;

          const barEl = document.getElementById(`bar-${station.id}`);
          if (barEl) barEl.style.width = `${station.progress}%`;

          const cost = getUpgradeCost(station);
          const canAfford = gameState.cash >= cost;
          btn.innerText = `Upgrade ($${cost.toLocaleString()})`;
          
          btn.className = canAfford 
            ? "px-4 py-2 text-xs font-bold rounded transition bg-amber-500 hover:bg-amber-400 text-black cursor-pointer" 
            : "px-4 py-2 text-xs font-bold rounded transition bg-gray-800 text-gray-500 cursor-not-allowed";
        }
      });
    }

    function handleStationAction(id) {
      const station = gameState.stations.find(s => s.id === id);
      if (!station) return;

      if (!station.unlocked) {
        if (gameState.cash >= station.unlockCost) {
          gameState.cash -= station.unlockCost;
          station.unlocked = true;
          station.level = 1;
          station.progress = 0;
          initUI();
          saveGame();
        }
      } else {
        const cost = getUpgradeCost(station);
        if (gameState.cash >= cost) {
          gameState.cash -= cost;
          station.level += 1;
          updateUI();
          saveGame();
        }
      }
    }

    function hireTechnician() {
      const cost = getTechCost();
      if (gameState.cash >= cost) {
        gameState.cash -= cost;
        gameState.techsHired += 1;
        updateUI();
        saveGame();
      }
    }

    function saveGame() {
      gameState.lastSaved = Date.now();
      localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
    }

    function loadGame() {
      const saved = localStorage.getItem(SAVE_KEY);
      if (saved) {
        try {
          const loadedState = JSON.parse(saved);
          gameState = { ...defaultState, ...loadedState };

          const elapsedSeconds = Math.max(0, (Date.now() - (gameState.lastSaved || Date.now())) / 1000);
          if (elapsedSeconds > 0) {
            let totalPerSec = 0;
            gameState.stations.forEach(s => {
              if (s.unlocked && s.cycleTime > 0) {
                totalPerSec += (getStationRevenue(s) / (s.cycleTime / 1000)) * getStationSpeedMultiplier(s);
              }
            });
            gameState.cash += totalPerSec * elapsedSeconds;
          }
        } catch (e) {
          console.error("Failed to load save:", e);
        }
      }
    }

    function exportSave() {
      saveGame();
      const blob = new Blob([JSON.stringify(gameState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `vinyl-empire-save-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importSave(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data && data.stations && typeof data.cash === 'number') {
            gameState = data;
            saveGame();
            initUI();
            alert('Save file imported successfully!');
          } else {
            alert('Invalid save file format.');
          }
        } catch (err) {
          alert('Error parsing JSON file.');
        }
      };
      reader.readAsText(file);
    }

    function resetGame() {
      if (confirm('Are you sure you want to reset all progress?')) {
        localStorage.removeItem(SAVE_KEY);
        gameState = JSON.parse(JSON.stringify(defaultState));
        initUI();
      }
    }

    // Main Game Loop (Runs 20 times per second)
    let lastTick = Date.now();
    setInterval(() => {
      const now = Date.now();
      const deltaMs = now - lastTick;
      lastTick = now;

      gameState.stations.forEach(station => {
        if (!station.unlocked) return;

        const speedMult = getStationSpeedMultiplier(station);
        const progressIncrement = (deltaMs / station.cycleTime) * 100 * speedMult;
        
        station.progress += progressIncrement;

        if (station.progress >= 100) {
          station.progress = 0;
          gameState.cash += getStationRevenue(station);
        }
      });

      updateUI();
    }, 50);

    setInterval(saveGame, 5000);

    // Initialization
    loadGame();
    initUI();
  </script>
</body>
</html>
