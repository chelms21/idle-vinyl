<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl Empire Idle</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vinyl: { 900: '#121212', 800: '#1e1e1e', 700: '#2a2a2a', accent: '#f59e0b' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-vinyl-900 text-gray-100 font-sans min-h-screen flex flex-col">

  <!-- Top Header Navigation / Dashboard -->
  <header class="bg-vinyl-800 border-b border-gray-800 p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-amber-500">💿 Vinyl Empire</h1>
        <p id="stage-title" class="text-xs text-gray-400">Garage DIY Press</p>
      </div>
      <div class="text-right">
        <div class="text-xs text-gray-400 uppercase tracking-wider">Cash Balance</div>
        <div id="cash-display" class="text-2xl font-black text-green-400">$0</div>
      </div>
    </div>
  </header>

  <!-- Main Game Workspace -->
  <main class="max-w-4xl w-full mx-auto p-4 flex-grow space-y-4">
    
    <!-- Action Bar & Save Management -->
    <div class="bg-vinyl-800 p-3 rounded-lg border border-gray-800 flex flex-wrap justify-between items-center gap-2">
      <div class="flex gap-2">
        <button onclick="exportSave()" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-xs font-semibold rounded transition">
          💾 Export Save
        </button>
        <button onclick="document.getElementById('import-input').click()" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-xs font-semibold rounded transition">
          📂 Import Save
        </button>
        <input type="file" id="import-input" accept=".json" class="hidden" onchange="importSave(event)" />
      </div>
      <button onclick="resetGame()" class="px-3 py-1.5 bg-red-900/40 hover:bg-red-800/60 text-red-300 text-xs font-semibold rounded transition">
        ⚠️ Reset
      </button>
    </div>

    <!-- Stations List -->
    <div id="stations-container" class="space-y-3">
      <!-- Dynamic stations rendered by JS -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-500 py-4 border-t border-gray-800">
    Vinyl Empire Idle • Static Web Application
  </footer>

  <!-- Core Game Logic -->
  <script>
    // Initial Game State Configuration
    const defaultState = {
      cash: 10,
      stage: 'Garage DIY Press',
      lastSaved: Date.now(),
      stations: [
        { id: 'lathe', name: '1. Mastering Lathe', level: 1, baseCost: 10, baseRevenue: 1, unlockCost: 0, unlocked: true },
        { id: 'plating', name: '2. Matrix Plating', level: 0, baseCost: 50, baseRevenue: 4, unlockCost: 50, unlocked: false },
        { id: 'granulator', name: '3. Vinyl Granulator', level: 0, baseCost: 250, baseRevenue: 18, unlockCost: 250, unlocked: false },
        { id: 'press', name: '4. Hydraulic Press', level: 0, baseCost: 1200, baseRevenue: 85, unlockCost: 1200, unlocked: false },
        { id: 'trimmer', name: '5. Edge Trimmer', level: 0, baseCost: 6000, baseRevenue: 400, unlockCost: 6000, unlocked: false },
        { id: 'sleeve', name: '6. Foil Sleeve Press', level: 0, baseCost: 35000, baseRevenue: 2200, unlockCost: 35000, unlocked: false }
      ]
    };

    let gameState = JSON.parse(JSON.stringify(defaultState));
    const SAVE_KEY = 'VINYL_EMPIRE_SAVE_V1';

    // Math Formulas
    function getUpgradeCost(station) {
      return Math.floor(station.baseCost * Math.pow(1.15, station.level));
    }

    function getStationRevenue(station) {
      return station.baseRevenue * station.level;
    }

    function getPerSecondIncome() {
      return gameState.stations.reduce((sum, s) => s.unlocked ? sum + getStationRevenue(s) : sum, 0);
    }

    // UI Rendering
    function render() {
      document.getElementById('cash-display').innerText = '$' + Math.floor(gameState.cash).toLocaleString();
      document.getElementById('stage-title').innerText = gameState.stage;

      const container = document.getElementById('stations-container');
      container.innerHTML = '';

      gameState.stations.forEach(station => {
        const card = document.createElement('div');
        card.className = `p-4 rounded-lg border transition ${
          station.unlocked 
            ? 'bg-vinyl-800 border-gray-800' 
            : 'bg-vinyl-900 border-gray-800/50 opacity-60'
        }`;

        if (!station.unlocked) {
          const canUnlock = gameState.cash >= station.unlockCost;
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-bold text-gray-400">${station.name}</h3>
                <p class="text-xs text-gray-500">Locked Station</p>
              </div>
              <button onclick="unlockStation('${station.id}')" 
                class="px-4 py-2 text-xs font-bold rounded ${
                  canUnlock 
                    ? 'bg-amber-500 hover:bg-amber-400 text-black cursor-pointer' 
                    : 'bg-gray-800 text-gray-500 cursor-not-allowed'
                }">
                Unlock ($${station.unlockCost.toLocaleString()})
              </button>
            </div>
          `;
        } else {
          const cost = getUpgradeCost(station);
          const revenue = getStationRevenue(station);
          const canAfford = gameState.cash >= cost;

          card.innerHTML = `
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <h3 class="font-bold text-gray-100">${station.name}</h3>
                  <span class="px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs rounded font-mono">Lvl ${station.level}</span>
                </div>
                <p class="text-xs text-gray-400">Yield: <span class="text-green-400 font-mono">+$${revenue.toLocaleString()}/sec</span></p>
              </div>
              <button onclick="upgradeStation('${station.id}')" 
                class="px-4 py-2 text-xs font-bold rounded transition ${
                  canAfford 
                    ? 'bg-amber-500 hover:bg-amber-400 text-black cursor-pointer' 
                    : 'bg-gray-800 text-gray-500 cursor-not-allowed'
                }">
                Upgrade ($${cost.toLocaleString()})
              </button>
            </div>
          `;
        }

        container.appendChild(card);
      });
    }

    // Actions
    function upgradeStation(id) {
      const station = gameState.stations.find(s => s.id === id);
      const cost = getUpgradeCost(station);
      if (station && station.unlocked && gameState.cash >= cost) {
        gameState.cash -= cost;
        station.level += 1;
        render();
        saveGame();
      }
    }

    function unlockStation(id) {
      const station = gameState.stations.find(s => s.id === id);
      if (station && !station.unlocked && gameState.cash >= station.unlockCost) {
        gameState.cash -= station.unlockCost;
        station.unlocked = true;
        station.level = 1;
        render();
        saveGame();
      }
    }

    // Save & Load Engine
    function saveGame() {
      gameState.lastSaved = Date.now();
      localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
    }

    function loadGame() {
      const saved = localStorage.getItem(SAVE_KEY);
      if (saved) {
        try {
          const loadedState = JSON.parse(saved);
          gameState = { ...defaultState, ...loadedState };

          // Offline progress calculation
          const elapsedSeconds = Math.max(0, (Date.now() - (gameState.lastSaved || Date.now())) / 1000);
          const offlineEarnings = getPerSecondIncome() * elapsedSeconds;
          if (offlineEarnings > 0) {
            gameState.cash += offlineEarnings;
            console.log(`Earned $${Math.floor(offlineEarnings)} while away for ${Math.floor(elapsedSeconds)}s`);
          }
        } catch (e) {
          console.error("Failed to load save:", e);
        }
      }
    }

    function exportSave() {
      saveGame();
      const blob = new Blob([JSON.stringify(gameState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `vinyl-empire-save-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importSave(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data && data.stations && typeof data.cash === 'number') {
            gameState = data;
            saveGame();
            render();
            alert('Save file imported successfully!');
          } else {
            alert('Invalid save file format.');
          }
        } catch (err) {
          alert('Error parsing JSON file.');
        }
      };
      reader.readAsText(file);
    }

    function resetGame() {
      if (confirm('Are you sure you want to reset all progress?')) {
        localStorage.removeItem(SAVE_KEY);
        gameState = JSON.parse(JSON.stringify(defaultState));
        render();
      }
    }

    // Main Game Loop (Runs 10 times per second)
    let lastTick = Date.now();
    setInterval(() => {
      const now = Date.now();
      const deltaSeconds = (now - lastTick) / 1000;
      lastTick = now;

      gameState.cash += getPerSecondIncome() * deltaSeconds;
      render();
    }, 100);

    // Auto-save every 5 seconds
    setInterval(saveGame, 5000);

    // Initialization
    loadGame();
    render();
  </script>
</body>
</html>
